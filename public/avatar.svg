<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
<title id="title">BrandPilot round-faced humanoid AI assistant</title>
<desc id="desc">Cute round-faced humanoid AI assistant with soft cheeks, large expressive eyes and subtle futuristic details.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="35%" r="78%"><stop offset="0" stop-color="#243b53"/><stop offset=".62" stop-color="#0d1724"/><stop offset="1" stop-color="#02060b"/></radialGradient>
<radialGradient id="skin" cx="45%" cy="35%" r="75%"><stop offset="0" stop-color="#fffaf5"/><stop offset=".58" stop-color="#f0e9e2"/><stop offset="1" stop-color="#c4cdd6"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#64748b"/><stop offset=".5" stop-color="#eef2f7"/><stop offset="1" stop-color="#475569"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<circle cx="200" cy="200" r="194" fill="url(#bg)" stroke="#60a5fa" stroke-opacity=".34" stroke-width="4"/>
<ellipse cx="200" cy="164" rx="128" ry="126" fill="#60a5fa" opacity=".08" filter="url(#soft)"/>

<!-- soft shoulders and neck -->
<path d="M103 392c8-47 43-77 82-84 5 17 10 26 15 31 5-5 10-14 15-31 39 7 74 37 82 84z" fill="#a9b5c1" opacity=".3"/>
<path d="M166 319v32c0 10-8 18-20 24h108c-12-6-20-14-20-24v-32z" fill="url(#metal)"/>

<!-- ears -->
<rect x="84" y="174" width="30" height="66" rx="15" fill="url(#metal)"/>
<rect x="286" y="174" width="30" height="66" rx="15" fill="url(#metal)"/>
<circle cx="99" cy="207" r="5" fill="#38bdf8" filter="url(#glow)"/>
<circle cx="301" cy="207" r="5" fill="#38bdf8" filter="url(#glow)"/>

<!-- much rounder, fuller baby-like humanoid face -->
<ellipse cx="200" cy="205" rx="103" ry="120" fill="url(#skin)"/>

<!-- subtle forehead shell -->
<path d="M137 145c14-39 37-63 63-63s49 24 63 63" fill="none" stroke="url(#metal)" stroke-width="9" stroke-linecap="round" opacity=".48"/>
<path d="M200 74v24" stroke="#60a5fa" stroke-width="3" opacity=".7" filter="url(#glow)"/>

<!-- rounded brows -->
<path d="M132 166c12-9 30-10 47-4" fill="none" stroke="#7c8794" stroke-width="6" stroke-linecap="round"/>
<path d="M221 162c17-6 35-5 47 4" fill="none" stroke="#7c8794" stroke-width="6" stroke-linecap="round"/>

<!-- large friendly eyes -->
<ellipse cx="160" cy="190" rx="34" ry="23" fill="#fff"/>
<ellipse cx="240" cy="190" rx="34" ry="23" fill="#fff"/>
<ellipse cx="160" cy="191" rx="14" ry="17" fill="#1e293b"/>
<ellipse cx="240" cy="191" rx="14" ry="17" fill="#1e293b"/>
<circle cx="164" cy="185" r="6" fill="#7dd3fc" filter="url(#glow)"/>
<circle cx="244" cy="185" r="6" fill="#7dd3fc" filter="url(#glow)"/>
<circle cx="155" cy="198" r="3" fill="#0f172a" opacity=".45"/>
<circle cx="235" cy="198" r="3" fill="#0f172a" opacity=".45"/>

<!-- small rounded nose -->
<path d="M198 198c-1 12-5 22-2 27 3 5 9 6 14 3" fill="none" stroke="#9aa6b2" stroke-width="4" stroke-linecap="round"/>

<!-- fuller baby cheeks -->
<ellipse cx="132" cy="235" rx="30" ry="20" fill="#f0b7ae" opacity=".20"/>
<ellipse cx="268" cy="235" rx="30" ry="20" fill="#f0b7ae" opacity=".20"/>

<!-- small gentle smile -->
<path d="M165 249c21 17 49 17 70 0" fill="none" stroke="#7a8793" stroke-width="5" stroke-linecap="round"/>
<path d="M178 252c13 6 31 6 44 0" fill="none" stroke="url(#blue)" stroke-width="3" stroke-linecap="round" opacity=".85" filter="url(#glow)">
<animate attributeName="opacity" values=".35;.95;.35" dur="2.4s" repeatCount="indefinite"/>
</path>

<!-- subtle AI details -->
<path d="M119 226l16 5M281 226l-16 5" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity=".42"/>
<circle cx="200" cy="48" r="8" fill="#38bdf8" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="2.2s" repeatCount="indefinite"/></circle>

<!-- blink -->
<path d="M131 190c18 10 40 10 58 0" fill="none" stroke="#f0e9e2" stroke-width="16" stroke-linecap="round" opacity="0">
<animate attributeName="opacity" values="0;0;.9;0;0" dur="5.5s" repeatCount="indefinite"/>
</path>
<path d="M211 190c18 10 40 10 58 0" fill="none" stroke="#f0e9e2" stroke-width="16" stroke-linecap="round" opacity="0">
<animate attributeName="opacity" values="0;0;.9;0;0" dur="5.5s" begin=".08s" repeatCount="indefinite"/>
</path>
</svg>
