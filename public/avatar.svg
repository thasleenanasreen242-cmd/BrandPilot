<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
  <title id="title">BrandPilot AI Assistant</title>
  <desc id="desc">A friendly futuristic AI assistant avatar with animated eyes and a subtle speaking glow.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="65%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#030712"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="194" fill="url(#bg)" stroke="#60a5fa" stroke-opacity=".35" stroke-width="4"/>
  <circle cx="200" cy="78" r="9" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="opacity" values=".35;1;.35" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <path d="M122 178c0-66 35-104 78-104s78 38 78 104v54c0 63-34 100-78 100s-78-37-78-100z" fill="url(#face)"/>
  <path d="M140 169c17-47 39-64 60-64s43 17 60 64" fill="none" stroke="#0f172a" stroke-opacity=".35" stroke-width="18" stroke-linecap="round"/>

  <rect x="144" y="174" width="42" height="28" rx="14" fill="#0f172a">
    <animate attributeName="height" values="28;20;28" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="214" y="174" width="42" height="28" rx="14" fill="#0f172a">
    <animate attributeName="height" values="28;20;28" dur="4.5s" begin=".12s" repeatCount="indefinite"/>
  </rect>
  <circle cx="165" cy="188" r="6" fill="#38bdf8"/>
  <circle cx="235" cy="188" r="6" fill="#38bdf8"/>

  <path d="M190 211c4 6 16 6 20 0" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
  <path d="M165 243c20 18 50 18 70 0" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" opacity=".9" filter="url(#glow)">
    <animate attributeName="opacity" values=".45;.95;.45" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <path d="M137 283c31 20 95 20 126 0" fill="none" stroke="#94a3b8" stroke-opacity=".45" stroke-width="8" stroke-linecap="round"/>
  <circle cx="200" cy="309" r="28" fill="url(#accent)" opacity=".18">
    <animate attributeName="r" values="24;32;24" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".12;.3;.12" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(200 350)">
    <path d="M-68 0c18-26 42-35 68-35s50 9 68 35" fill="none" stroke="#60a5fa" stroke-opacity=".45" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
