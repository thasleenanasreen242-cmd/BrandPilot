<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
<title id="title">BrandPilot cute humanoid AI assistant</title>
<desc id="desc">Cute baby-faced humanoid AI assistant with soft realistic facial proportions, large expressive eyes and subtle futuristic details.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="35%" r="78%"><stop offset="0" stop-color="#243b53"/><stop offset=".62" stop-color="#0d1724"/><stop offset="1" stop-color="#02060b"/></radialGradient>
<linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf5"/><stop offset=".46" stop-color="#f0e9e2"/><stop offset="1" stop-color="#c4cdd6"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#64748b"/><stop offset=".5" stop-color="#eef2f7"/><stop offset="1" stop-color="#475569"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<circle cx="200" cy="200" r="194" fill="url(#bg)" stroke="#60a5fa" stroke-opacity=".34" stroke-width="4"/>
<ellipse cx="200" cy="160" rx="120" ry="128" fill="#60a5fa" opacity=".08" filter="url(#soft)"/>

<!-- soft humanoid shoulders -->
<path d="M105 392c8-47 43-77 82-84 5 17 10 26 13 31h0c3-5 8-14 13-31 39 7 74 37 82 84z" fill="#a9b5c1" opacity=".3"/>
<path d="M166 318v32c0 10-8 18-20 24h108c-12-6-20-14-20-24v-32z" fill="url(#metal)"/>

<!-- subtle ears -->
<rect x="93" y="174" width="26" height="65" rx="13" fill="url(#metal)"/>
<rect x="281" y="174" width="26" height="65" rx="13" fill="url(#metal)"/>
<circle cx="106" cy="207" r="5" fill="#38bdf8" filter="url(#glow)"/>
<circle cx="294" cy="207" r="5" fill="#38bdf8" filter="url(#glow)"/>

<!-- cute rounded baby-like humanoid face -->
<path d="M120 171c0-69 35-112 80-112s80 43 80 112v57c0 70-35 109-80 109s-80-39-80-109z" fill="url(#skin)"/>

<!-- soft forehead shell -->
<path d="M138 148c13-42 37-68 62-68s49 26 62 68" fill="none" stroke="url(#metal)" stroke-width="9" stroke-linecap="round" opacity=".5"/>
<path d="M200 72v25" stroke="#60a5fa" stroke-width="3" opacity=".7" filter="url(#glow)"/>

<!-- rounded brows -->
<path d="M141 163c11-8 27-10 43-4" fill="none" stroke="#7c8794" stroke-width="6" stroke-linecap="round"/>
<path d="M216 159c16-6 32-4 43 4" fill="none" stroke="#7c8794" stroke-width="6" stroke-linecap="round"/>

<!-- large expressive eyes -->
<ellipse cx="164" cy="187" rx="33" ry="22" fill="#fff"/>
<ellipse cx="236" cy="187" rx="33" ry="22" fill="#fff"/>
<ellipse cx="164" cy="188" rx="14" ry="16" fill="#1e293b"/>
<ellipse cx="236" cy="188" rx="14" ry="16" fill="#1e293b"/>
<circle cx="168" cy="183" r="6" fill="#7dd3fc" filter="url(#glow)"/>
<circle cx="240" cy="183" r="6" fill="#7dd3fc" filter="url(#glow)"/>
<circle cx="159" cy="195" r="3" fill="#0f172a" opacity=".45"/>
<circle cx="231" cy="195" r="3" fill="#0f172a" opacity=".45"/>

<!-- small rounded nose -->
<path d="M198 195c-1 13-5 24-2 29 3 5 9 6 14 3" fill="none" stroke="#9aa6b2" stroke-width="4" stroke-linecap="round"/>

<!-- soft cheeks -->
<ellipse cx="145" cy="230" rx="23" ry="13" fill="#f0b7ae" opacity=".17"/>
<ellipse cx="255" cy="230" rx="23" ry="13" fill="#f0b7ae" opacity=".17"/>

<!-- gentle smile -->
<path d="M165 245c21 18 49 18 70 0" fill="none" stroke="#7a8793" stroke-width="5" stroke-linecap="round"/>
<path d="M177 248c14 7 32 7 46 0" fill="none" stroke="url(#blue)" stroke-width="3" stroke-linecap="round" opacity=".85" filter="url(#glow)">
<animate attributeName="opacity" values=".35;.95;.35" dur="2.4s" repeatCount="indefinite"/>
</path>

<!-- subtle futuristic face details -->
<path d="M137 223l14 4M263 223l-14 4" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity=".45"/>
<circle cx="200" cy="47" r="8" fill="#38bdf8" filter="url(#glow)"><animate attributeName="opacity" values=".25;1;.25" dur="2.2s" repeatCount="indefinite"/></circle>

<!-- natural blink -->
<g>
<rect x="132" y="173" width="65" height="30" rx="18" fill="#f0e9e2" opacity="0">
<animate attributeName="opacity" values="0;0;0.9;0;0" dur="5.5s" repeatCount="indefinite"/>
</rect>
<rect x="203" y="173" width="65" height="30" rx="18" fill="#f0e9e2" opacity="0">
<animate attributeName="opacity" values="0;0;0.9;0;0" dur="5.5s" begin=".08s" repeatCount="indefinite"/>
</rect>
</g>
</svg>
