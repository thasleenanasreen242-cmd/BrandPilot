<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc">
<title id="title">BrandPilot AI humanoid assistant</title>
<desc id="desc">Premium humanoid robot assistant with realistic facial proportions, expressive blue eyes and subtle futuristic details.</desc>
<defs>
<radialGradient id="bg" cx="50%" cy="35%" r="75%"><stop offset="0" stop-color="#24364b"/><stop offset=".58" stop-color="#0d1724"/><stop offset="1" stop-color="#02060b"/></radialGradient>
<linearGradient id="skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1f5f9"/><stop offset=".5" stop-color="#d7dee7"/><stop offset="1" stop-color="#9ba9b8"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#64748b"/><stop offset=".5" stop-color="#e2e8f0"/><stop offset="1" stop-color="#475569"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>
<circle cx="200" cy="200" r="194" fill="url(#bg)" stroke="#60a5fa" stroke-opacity=".35" stroke-width="4"/>
<ellipse cx="200" cy="155" rx="116" ry="126" fill="#38bdf8" opacity=".08" filter="url(#soft)"/>
<!-- humanoid neck and shoulders -->
<path d="M160 310v30c0 12-10 20-24 25h128c-14-5-24-13-24-25v-30z" fill="url(#metal)"/>
<path d="M104 389c7-45 38-67 73-74 15 17 31 25 46 25s31-8 46-25c35 7 66 29 73 74z" fill="#94a3b8" opacity=".32"/>
<!-- ears -->
<rect x="91" y="166" width="28" height="75" rx="14" fill="url(#metal)"/>
<rect x="281" y="166" width="28" height="75" rx="14" fill="url(#metal)"/>
<circle cx="105" cy="203" r="6" fill="#38bdf8" filter="url(#glow)"/><circle cx="295" cy="203" r="6" fill="#38bdf8" filter="url(#glow)"/>
<!-- human-like face -->
<path d="M119 169c0-70 36-111 81-111s81 41 81 111v61c0 68-36 104-81 104s-81-36-81-104z" fill="url(#skin)"/>
<!-- subtle forehead shell -->
<path d="M137 150c13-47 36-72 63-72s50 25 63 72" fill="none" stroke="url(#metal)" stroke-width="11" stroke-linecap="round" opacity=".75"/>
<path d="M199 69v32" stroke="#38bdf8" stroke-width="3" opacity=".75" filter="url(#glow)"/>
<!-- eyebrows -->
<path d="M142 164c13-10 29-12 45-5" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
<path d="M213 159c16-7 32-5 45 5" fill="none" stroke="#64748b" stroke-width="7" stroke-linecap="round"/>
<!-- expressive eyes -->
<ellipse cx="165" cy="184" rx="31" ry="19" fill="#f8fafc"/>
<ellipse cx="235" cy="184" rx="31" ry="19" fill="#f8fafc"/>
<circle cx="165" cy="184" r="12" fill="#0f172a"/>
<circle cx="235" cy="184" r="12" fill="#0f172a"/>
<circle cx="168" cy="180" r="5" fill="#38bdf8" filter="url(#glow)"/>
<circle cx="238" cy="180" r="5" fill="#38bdf8" filter="url(#glow)"/>
<path d="M134 184c3-28 58-28 62 0" fill="none" stroke="#94a3b8" stroke-width="3" opacity=".55"/>
<path d="M204 184c3-28 58-28 62 0" fill="none" stroke="#94a3b8" stroke-width="3" opacity=".55"/>
<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 1;0 0" dur="5s" repeatCount="indefinite"/>
<!-- nose -->
<path d="M198 193c-2 16-7 27-4 34 3 6 10 8 17 4" fill="none" stroke="#8795a5" stroke-width="5" stroke-linecap="round"/>
<!-- friendly mouth -->
<path d="M166 246c19 15 49 15 68 0" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round"/>
<path d="M174 248c16 7 36 7 52 0" fill="none" stroke="url(#blue)" stroke-width="3" stroke-linecap="round" opacity=".85" filter="url(#glow)">
<animate attributeName="opacity" values=".35;.95;.35" dur="2s" repeatCount="indefinite"/>
</path>
<!-- cheek interface accents -->
<path d="M139 225l16 5M261 225l-16 5" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity=".7"/>
<circle cx="200" cy="48" r="8" fill="#38bdf8" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="2.2s" repeatCount="indefinite"/></circle>
</svg>
